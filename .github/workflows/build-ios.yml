
name: Build Nightwell Music iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild -project NightwellMusic.xcodeproj -scheme NightwellMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          cp -R build-device/Build/Products/Release-iphoneos/NightwellMusic.app output/Payload/
          cd output
          zip -r Nightwell-Music-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nightwell-Music-unsigned
          path: output/Nightwell-Music-unsigned.ipa
          retention-days: 14
